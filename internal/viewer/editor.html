<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVERA — 確認と判断</title><link rel="stylesheet" href="/editor.css"><script defer src="/editor.js"></script></head>
<body><header><div><small>AVERA / REVIEW WORKSPACE</small><h1>確認と判断</h1><p id="target">レポートを読み込んでいます…</p></div><nav><a href="/download.json" id="json-download">JSON を持ち帰る</a><a href="/export.html" id="html-export">HTML を出力</a></nav></header>
<main><p class="notice">観測した事実は変更しません。説明と判断を保存すると、新しいレポート JSON を作成します。過去の判断は履歴に残ります。「追加対応不要」は人による判断であり、ツールによる安全性の保証ではありません。</p><div id="status" role="status" aria-live="polite"></div><div id="metrics" class="metrics"></div><div class="tabs"><button id="edit-tab" type="button">確認・判断を編集</button><button id="preview-tab" type="button">提出用レポートを見る</button></div><div id="editor"><section><h2>今回の確認項目</h2><p>項目を開いて観測内容と以前の説明を確認し、今回の判断を保存してください。収集が不完全な場合、保存しても「追加対応不要」の判断を適用できないことがあります。</p></section><div id="items"></div><details><summary>収集範囲と制限</summary><pre id="coverage"></pre></details><details><summary>対応する観測がない以前の判断</summary><div id="unmatched"></div></details><details><summary>置き換え前の判断履歴</summary><div id="history"></div></details></div><iframe id="preview" title="提出用レポートのプレビュー" hidden></iframe></main></body></html>
